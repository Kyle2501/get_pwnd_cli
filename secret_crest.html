<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="font-family:'Rockwell', 'Georgia', serif;">
  <defs>
    <!-- Hard Cel Drop Shadow for Icon Elements -->
    <filter id="iconCelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="0" flood-color="#0a100c" flood-opacity="0.95"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#121a14" flood-opacity="0.9"/>
    </filter>

    <!-- Deep Forest Ranger Evergreen Gradients -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d4a33"/>
      <stop offset="60%" stop-color="#1b2e20"/>
      <stop offset="100%" stop-color="#111c14"/>
    </linearGradient>

    <!-- Warm Sonoran Sunset Horizon Sky -->
    <linearGradient id="crestSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d47a38"/>
      <stop offset="55%" stop-color="#e29b4e"/>
      <stop offset="100%" stop-color="#f4ebd9"/>
    </linearGradient>

    <!-- Golden-Hour Specular Highlight -->
    <linearGradient id="rimGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ==================== BASE SQUIRCLE ICON CONTAINER ==================== -->
  <!-- Outer App Icon Body (iOS / Android adaptive squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#squircleBg)" stroke="#0e1710" stroke-width="8" />
  
  <!-- Tactile Inner Border (Weathered Timber & Screenprint Edge) -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#e8d8b8" stroke-width="3" stroke-dasharray="8,6" opacity="0.4" />
  
  <!-- Subtle Top Specular Curved Sheen -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#rimGlint)" pointer-events="none" />

  <!-- ==================== NPS ARROWHEAD CREST SHIELD ==================== -->
  <g id="arrowhead-crest" transform="translate(0, -6)" filter="url(#iconCelShadow)">
    <!-- Dark Timber Outer Routed Flange -->
    <polygon points="256,58 396,168 366,380 256,450 146,380 116,168" fill="#432818" stroke="#120c08" stroke-width="8" />

    <!-- Carved Parchment Inset Line -->
    <polygon points="256,76 380,174 352,366 256,430 160,366 132,174" fill="#f4ebd9" stroke="#1d120a" stroke-width="4" />

    <!-- Sky Horizon & Interior Badge Field -->
    <polygon points="256,86 368,176 342,356 256,418 170,356 144,176" fill="url(#crestSky)" stroke="#2b1a0e" stroke-width="3" />

    <!-- Mountain Silhouette (Camelback / Superstitions Horizon) -->
    <polygon points="144,285 200,225 240,260 295,200 360,270 360,360 144,360" fill="#583c28" stroke="#1d120a" stroke-width="3" />
    <polygon points="200,225 240,260 220,285 170,285" fill="#7f5539" />
    <polygon points="295,200 360,270 330,285 270,285" fill="#7f5539" />

    <!-- Desert Foreground Saguaro Cacti (Left & Right Flanks) -->
    <path d="M 175 320 L 175 250 A 5 5 0 0 1 185 250 L 185 320 Z M 165 275 L 175 275 M 165 265 L 165 285 M 185 282 L 195 282 M 195 272 L 195 292" stroke="#283618" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M 335 320 L 335 255 A 5 5 0 0 1 345 255 L 345 320 Z M 325 280 L 335 280 M 325 270 L 325 290" stroke="#283618" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- ================= TURTLE ISLAND EMBLEM INSIGNIA ================= -->
    <g id="turtle-totem" transform="translate(256, 318)" filter="url(#badgeShadow)">
      <!-- Ground / Shadow Base Under Turtle -->
      <ellipse cx="0" cy="58" rx="72" ry="14" fill="#1b251c" opacity="0.6"/>

      <!-- Turtle Flippers & Head (Cel-shaded Forest Green) -->
      <!-- Head -->
      <path d="M -12 -58 Q 0 -76 12 -58 Q 8 -44 -12 -44 Z" fill="#606c38" stroke="#121812" stroke-width="4" />
      <!-- Front Flippers (Sweeping) -->
      <path d="M -26 -35 Q -74 -30 -62 0 Q -42 6 -20 -15 Z" fill="#606c38" stroke="#121812" stroke-width="4" />
      <path d="M 26 -35 Q 74 -30 62 0 Q 42 6 20 -15 Z" fill="#606c38" stroke="#121812" stroke-width="4" />
      <!-- Rear Flippers -->
      <path d="M -22 36 Q -50 56 -32 64 Q -16 64 -10 44 Z" fill="#606c38" stroke="#121812" stroke-width="4" />
      <path d="M 22 36 Q 50 56 32 64 Q 16 64 10 44 Z" fill="#606c38" stroke="#121812" stroke-width="4" />

      <!-- Main Shell (Carapace) -->
      <ellipse cx="0" cy="6" rx="46" ry="52" fill="#283618" stroke="#10180d" stroke-width="5" />
      
      <!-- Shell Geometry / Scute Segments (Warm Ochre & Cream) -->
      <polygon points="0,-32 20,-16 20,10 0,26 -20,10 -20,-16" fill="#dda15e" stroke="#10180d" stroke-width="3" />
      <polygon points="0,26 16,36 0,46 -16,36" fill="#bc6c25" stroke="#10180d" stroke-width="2.5" />
      <!-- Radiating Scute Lines -->
      <line x1="-20" y1="-16" x2="-42" y2="-24" stroke="#10180d" stroke-width="3" />
      <line x1="20" y1="-16" x2="42" y2="-24" stroke="#10180d" stroke-width="3" />
      <line x1="-20" y1="10" x2="-44" y2="12" stroke="#10180d" stroke-width="3" />
      <line x1="20" y1="10" x2="44" y2="12" stroke="#10180d" stroke-width="3" />
      <line x1="0" y1="26" x2="0" y2="52" stroke="#10180d" stroke-width="3" />

      <!-- Center Star / Statehood Point -->
      <polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fefae0" stroke="#10180d" stroke-width="1.5"/>
    </g>

    <!-- Top Arch Text: TURTLE ISLAND -->
    <path id="arch-top" d="M 152 145 Q 256 95 360 145" fill="none" />
    <text font-size="19" font-weight="900" letter-spacing="4" fill="#2d4a33">
      <textPath href="#arch-top" startOffset="50%" text-anchor="middle">
        TURTLE ISLAND
      </textPath>
    </text>

    <!-- Bottom Ribbon Tab: TREATS -->
    <g transform="translate(256, 396)">
      <polygon points="-55,-12 55,-12 48,14 -48,14" fill="#bc4749" stroke="#1a0c0e" stroke-width="3" />
      <text x="0" y="7" fill="#f4ebd9" font-size="14" font-weight="900" letter-spacing="4" text-anchor="middle">TREATS</text>
    </g>
  </g>

  <!-- Subtle Bottom Notification / Connectivity Pip -->
  <circle cx="430" cy="430" r="14" fill="#ff9f1c" stroke="#1b2e20" stroke-width="4" />
  <circle cx="430" cy="430" r="5" fill="#ffffff" />
</svg>
