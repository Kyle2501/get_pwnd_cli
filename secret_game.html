<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSX Lo-Fi 3D Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #000;
      overflow: hidden;
      font-family: monospace;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      image-rendering: pixelated;
    }
    /* CRT Scanline & Grain Overlay */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.25) 0px,
        rgba(0, 0, 0, 0.25) 1px,
        transparent 1px,
        transparent 2px
      );
      mix-blend-mode: overlay;
      opacity: 0.7;
    }
    /* Diegetic Nokia Brick HUD */
    #phone-hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 140px;
      height: 220px;
      background: #c2c4ba;
      border: 4px solid #3a3d40;
      border-radius: 20px 20px 30px 30px;
      box-shadow: inset -3px -3px 0 #888, inset 3px 3px 0 #eee, 4px 6px 12px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 8px;
    }
    #phone-screen {
      width: 110px;
      height: 75px;
      background: #99a838;
      border: 3px solid #2d3024;
      border-radius: 6px;
      box-shadow: inset 2px 2px 4px rgba(0,0,0,0.4);
      color: #1a2008;
      font-size: 9px;
      line-height: 1.2;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 14px;
      width: 100px;
    }
    .phone-key {
      background: #4a4d52;
      border-radius: 4px;
      height: 12px;
      box-shadow: 0 2px 0 #222;
    }
    #instructions {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #ffd700;
      font-size: 12px;
      text-shadow: 2px 2px #000;
      letter-spacing: 1px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div class="scanlines"></div>

  <!-- Nokia HUD -->
  <div id="phone-hud">
    <div id="phone-screen">
      <div style="display: flex; justify-content: space-between;">
        <span>▲■■■</span>
        <span>NOKIA</span>
        <span>⚡■■</span>
      </div>
      <div id="hud-status" style="text-align: center; font-weight: bold; margin: 4px 0;">
        TRACK 01<br />STARS: 0/3
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 8px;">
        <span>MENU</span>
        <span>NAMES</span>
      </div>
    </div>
    <div class="keypad-grid">
      <div class="phone-key"></div><div class="phone-key"></div><div class="phone-key"></div>
      <div class="phone-key"></div><div class="phone-key"></div><div class="phone-key"></div>
      <div class="phone-key"></div><div class="phone-key"></div><div class="phone-key"></div>
    </div>
  </div>

  <div id="instructions">WASD / ARROWS : ROAM</div>

  <script>
    // -------------------------------------------------------------------------
    // 1. Scene & Low-Res PS1 Target
    // -------------------------------------------------------------------------
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0b11);
    scene.fog = new THREE.FogExp2(0x0c0b11, 0.035);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    
    // Target retro internal resolution
    const retroWidth = 480;
    const retroHeight = 360;
    renderer.setSize(retroWidth, retroHeight, false);
    renderer.domElement.style.width = "100%";
    renderer.domElement.style.height = "100%";
    container.appendChild(renderer.domElement);

    // -------------------------------------------------------------------------
    // 2. Custom PS1 Jitter Shader Material
    // -------------------------------------------------------------------------
    function makePS1Material(colorHex, emissiveHex = 0x000000) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: new THREE.Color(colorHex) },
          uEmissive: { value: new THREE.Color(emissiveHex) },
          uLightDir: { value: new THREE.Vector3(0.5, 1.0, 0.3).normalize() }
        },
        vertexShader: `
          varying vec3 vNormal;
          void main() {
            vNormal = normalMatrix * normal;
            vec4 clipPos = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            
            // PS1 Affine / Vertex Snapping Emulation
            vec4 snapped = clipPos;
            snapped.xyz = clipPos.xyz / clipPos.w;
            snapped.xy = floor(snapped.xy * 120.0) / 120.0;
            snapped.xyz *= clipPos.w;
            
            gl_Position = snapped;
          }
        `,
        fragmentShader: `
          uniform vec3 uColor;
          uniform vec3 uEmissive;
          uniform vec3 uLightDir;
          varying vec3 vNormal;
          void main() {
            float nDotL = max(dot(normalize(vNormal), uLightDir), 0.0);
            // 2-tone cel quantization
            float lightIntensity = nDotL > 0.4 ? 1.0 : 0.35;
            vec3 finalColor = (uColor * lightIntensity) + uEmissive;
            gl_FragColor = vec4(finalColor, 1.0);
          }
        `
      });
    }

    // -------------------------------------------------------------------------
    // 3. World Environment
    // -------------------------------------------------------------------------
    // Checker floor
    const floorGeo = new THREE.PlaneGeometry(80, 80, 40, 40);
    floorGeo.rotateX(-Math.PI / 2);
    const floorMat = makePS1Material(0x16141c);
    const floor = new THREE.Mesh(floorGeo, floorMat);
    scene.add(floor);

    // Monolithic pillars
    const pillarGeo = new THREE.BoxGeometry(2, 8, 2);
    const pillarMat = makePS1Material(0x282333);
    for (let i = 0; i < 20; i++) {
      const p = new THREE.Mesh(pillarGeo, pillarMat);
      p.position.set(
        (Math.random() - 0.5) * 60,
        4,
        (Math.random() - 0.5) * 60
      );
      scene.add(p);
    }

    // -------------------------------------------------------------------------
    // 4. Low-Poly Super Star Collectibles
    // -------------------------------------------------------------------------
    function createStarMesh() {
      // 5-pointed star via 2D shape extrusion
      const starShape = new THREE.Shape();
      const points = 5;
      const innerRadius = 0.45;
      const outerRadius = 0.95;
      for (let i = 0; i < points * 2; i++) {
        const r = i % 2 === 0 ? outerRadius : innerRadius;
        const angle = (i * Math.PI) / points;
        const x = Math.sin(angle) * r;
        const y = Math.cos(angle) * r;
        if (i === 0) starShape.moveTo(x, y);
        else starShape.lineTo(x, y);
      }
      starShape.closePath();

      const extrudeSettings = { depth: 0.3, bevelEnabled: false };
      const starGeo = new THREE.ExtrudeGeometry(starShape, extrudeSettings);
      starGeo.center();

      const starMat = makePS1Material(0xffdf00, 0x554400);
      const starMesh = new THREE.Mesh(starGeo, starMat);

      // Star Eyes (2 black vertical slits)
      const eyeGeo = new THREE.BoxGeometry(0.08, 0.28, 0.08);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.16, 0.05, 0.18);
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.16, 0.05, 0.18);
      starMesh.add(leftEye, rightEye);

      return starMesh;
    }

    const stars = [];
    const starCoords = [[-6, 1.5, -8], [8, 1.5, -12], [0, 1.5, 14]];
    starCoords.forEach(([x, y, z]) => {
      const star = createStarMesh();
      star.position.set(x, y, z);
      scene.add(star);
      stars.push(star);
    });

    // -------------------------------------------------------------------------
    // 5. Stylized Character Mesh
    // -------------------------------------------------------------------------
    const player = new THREE.Group();

    // Yellow Jacket / Torso
    const torso = new THREE.Mesh(
      new THREE.CylinderGeometry(0.35, 0.45, 1.0, 6),
      makePS1Material(0xf4d32e)
    );
    torso.position.y = 1.0;
    player.add(torso);

    // Dark Legs
    const legs = new THREE.Mesh(
      new THREE.CylinderGeometry(0.3, 0.3, 0.9, 6),
      makePS1Material(0x1a1921)
    );
    legs.position.y = 0.45;
    player.add(legs);

    // Head
    const head = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 6, 5),
      makePS1Material(0xf8d7c4)
    );
    head.position.y = 1.7;
    player.add(head);

    // Black Shaggy Hair
    const hair = new THREE.Mesh(
      new THREE.ConeGeometry(0.55, 0.75, 6),
      makePS1Material(0x111116)
    );
    hair.rotation.x = Math.PI;
    hair.position.set(0, 1.85, 0.05);
    player.add(hair);

    // Neon Pink Headphones (Earpads + Band)
    const phoneMat = makePS1Material(0xff77c6, 0x440028);
    const leftPad = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 6), phoneMat);
    leftPad.rotation.z = Math.PI / 2;
    leftPad.position.set(-0.38, 1.7, 0);
    
    const rightPad = leftPad.clone();
    rightPad.position.set(0.38, 1.7, 0);

    const band = new THREE.Mesh(new THREE.TorusGeometry(0.36, 0.04, 4, 8, Math.PI), phoneMat);
    band.position.set(0, 1.72, 0);

    player.add(leftPad, rightPad, band);
    scene.add(player);

    // -------------------------------------------------------------------------
    // 6. Input & Movement Logic
    // -------------------------------------------------------------------------
    const keys = {};
    window.addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = true));
    window.addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));

    let score = 0;
    const hudStatus = document.getElementById("hud-status");

    function updateControls(delta) {
      const speed = 7.0 * delta;
      let moved = false;

      if (keys["w"] || keys["arrowup"]) {
        player.position.z -= speed;
        player.rotation.y = Math.PI;
        moved = true;
      }
      if (keys["s"] || keys["arrowdown"]) {
        player.position.z += speed;
        player.rotation.y = 0;
        moved = true;
      }
      if (keys["a"] || keys["arrowleft"]) {
        player.position.x -= speed;
        player.rotation.y = -Math.PI / 2;
        moved = true;
      }
      if (keys["d"] || keys["arrowright"]) {
        player.position.x += speed;
        player.rotation.y = Math.PI / 2;
        moved = true;
      }

      // Bobbing walk cycle
      if (moved) {
        player.position.y = Math.abs(Math.sin(Date.now() * 0.012)) * 0.12;
      } else {
        player.position.y = 0;
      }

      // Star pickups
      for (let i = stars.length - 1; i >= 0; i--) {
        if (player.position.distanceTo(stars[i].position) < 1.3) {
          scene.remove(stars[i]);
          stars.splice(i, 1);
          score++;
          hudStatus.innerHTML = `TRACK 01<br/>STARS: ${score}/3`;
        }
      }

      // Smooth chase camera
      const targetCamX = player.position.x;
      const targetCamY = player.position.y + 3.2;
      const targetCamZ = player.position.z + 5.5;

      camera.position.x += (targetCamX - camera.position.x) * 0.1;
      camera.position.y += (targetCamY - camera.position.y) * 0.1;
      camera.position.z += (targetCamZ - camera.position.z) * 0.1;
      camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z);
    }

    // -------------------------------------------------------------------------
    // 7. Loop
    // -------------------------------------------------------------------------
    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // Animate stars
      stars.forEach((star, idx) => {
        star.rotation.y += 1.8 * delta;
        star.position.y = 1.4 + Math.sin(now * 0.003 + idx) * 0.2;
      });

      updateControls(delta);
      renderer.render(scene, camera);
    }

    animate(performance.now());

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
