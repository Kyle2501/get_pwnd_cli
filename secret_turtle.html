<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TW-PHX // Desert Grid Flow Engine</title>
  <style>
    :root {
      --bg-dark: #121013;
      --panel-bg: #1c1a1f;
      --accent-amber: #ff9f1c;
      --accent-cyan: #2ec4b6;
      --accent-red: #e71d36;
      --text-main: #fdfffc;
      --text-muted: #8d99ae;
      --border-dark: #2b2830;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--panel-bg);
      border: 2px solid var(--border-dark);
      border-radius: 8px 8px 0 0;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    .status-tag {
      color: var(--accent-amber);
      font-weight: bold;
    }
    #stage-container {
      width: 100%;
      max-width: 480px;
      height: 380px;
      background: #242028;
      border-left: 2px solid var(--border-dark);
      border-right: 2px solid var(--border-dark);
      position: relative;
      overflow: hidden;
    }
    svg.viewport {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Controls Panel */
    .dashboard {
      width: 100%;
      max-width: 480px;
      background: var(--panel-bg);
      border: 2px solid var(--border-dark);
      border-radius: 0 0 8px 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    button.action-btn {
      background: #28252e;
      border: 1px solid var(--border-dark);
      color: var(--text-main);
      padding: 10px 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, border-color 0.15s;
    }
    button.action-btn:active {
      background: var(--accent-amber);
      color: #000;
    }
    .customizer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141216;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
    }
    .customizer-row select {
      background: #25222b;
      color: var(--accent-cyan);
      border: 1px solid var(--border-dark);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .hud-metrics {
      display: flex;
      justify-content: space-around;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-dark);
      padding-top: 8px;
    }
  </style>
</head>
<body>

  <header>
    <span>PHX-TW // SECTOR 04</span>
    <span class="status-tag" id="flow-indicator">FLOW: NORMAL</span>
  </header>

  <div id="stage-container">
    <svg class="viewport" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Amber Sonoran Haze Filter -->
        <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#3d2639"/>
          <stop offset="60%" stop-color="#b85d38"/>
          <stop offset="100%" stop-color="#f49e4c"/>
        </linearGradient>
        <!-- Cell Shaded Drop Shadow Filter -->
        <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#0e0a12" flood-opacity="0.8"/>
        </filter>
      </defs>

      <!-- Environment / Distant Phoenix Skyline -->
      <rect width="400" height="150" fill="url(#skyGrad)" />
      <path d="M 0 150 L 50 120 L 70 120 L 90 135 L 140 100 L 165 100 L 180 150 L 260 110 L 285 110 L 305 130 L 350 95 L 380 95 L 400 150 Z" fill="#201524" />

      <!-- Heat Shimmer & Road Surface -->
      <rect y="150" width="400" height="170" fill="#1b171f" />
      <!-- Road markings / perspective grid -->
      <path d="M 120 150 L 0 320 M 280 150 L 400 320 M 200 150 L 200 320" stroke="#ffb703" stroke-dasharray="14,10" stroke-width="2" opacity="0.4" />

      <!-- Dynamic AV / Cart Runway Slot -->
      <g id="entity-slot" transform="translate(40, 160) scale(0.65)"></g>

      <!-- Central Warden Pedestal Base -->
      <g id="pedestal" transform="translate(180, 230)">
        <polygon points="0,40 40,40 32,70 8,70" fill="#2d2b33" stroke="#121013" stroke-width="2" />
        <rect x="-10" y="32" width="60" height="10" rx="2" fill="#504a5a" stroke="#121013" stroke-width="2" />
        <text x="20" y="58" font-size="8" fill="#ffb703" font-weight="900" text-anchor="middle">ADOT</text>
      </g>

      <!-- Modular ADOT Peace Officer Warden SVG Component -->
      <g id="warden-rig" transform="translate(182, 125)" filter="url(#hardShadow)">
        <!-- Lower Body / Trousers -->
        <path id="warden-legs" d="M 12 70 L 10 115 L 17 115 L 20 85 L 23 115 L 30 115 L 28 70 Z" fill="#2b3a4a" stroke="#0e131a" stroke-width="2" />
        <!-- Boots -->
        <rect x="8" y="113" width="10" height="7" rx="2" fill="#111" />
        <rect x="22" y="113" width="10" height="7" rx="2" fill="#111" />
        <!-- Torso / Uniform Shirt -->
        <path id="warden-torso" d="M 8 40 L 32 40 L 28 72 L 12 72 Z" fill="#8ea8c3" stroke="#0e131a" stroke-width="2" />
        <!-- Sam Browne Cross Belt -->
        <line x1="10" y1="42" x2="26" y2="72" stroke="#231913" stroke-width="3" />
        <rect x="11" y="69" width="18" height="5" fill="#231913" />
        <!-- Head & Peaked Sun Cap -->
        <circle cx="20" cy="28" r="8" fill="#d4a373" />
        <!-- Mustache -->
        <path d="M 17 31 Q 20 33 23 31" stroke="#222" stroke-width="1.5" fill="none" />
        <!-- Cap with High Crown -->
        <path d="M 10 24 L 30 24 L 32 18 L 8 18 Z" fill="#ffffff" stroke="#0e131a" stroke-width="2" />
        <path d="M 8 24 L 32 24 L 28 27 L 12 27 Z" fill="#1b263b" />
        <circle cx="20" cy="21" r="2" fill="#ffb703" /> <!-- Badge -->

        <!-- Dynamic Arms Group (Poseable) -->
        <g id="warden-arms">
          <!-- Left Hand / Directional Point -->
          <path id="arm-left" d="M 8 44 L -14 38 L -18 39" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round" fill="none" />
          <circle cx="-20" cy="39" r="4" fill="#ffffff" stroke="#0e131a" stroke-width="1.5" /> <!-- White glove -->
          <!-- Right Hand / Palm Stop -->
          <path id="arm-right" d="M 32 44 L 46 35 L 46 22" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round" fill="none" />
          <polygon points="43,22 49,22 50,14 44,14" fill="#ffffff" stroke="#0e131a" stroke-width="1.5" /> <!-- High palm -->
        </g>
      </g>
    </svg>
  </div>

  <div class="dashboard">
    <!-- Warden Command Triggers -->
    <div class="btn-group">
      <button class="action-btn" onclick="triggerPose('halt')">
        <span>✋ HALT AV</span>
        <small style="color:var(--accent-red)">HOLD</small>
      </button>
      <button class="action-btn" onclick="triggerPose('wave')">
        <span>👉 ADVANCE</span>
        <small style="color:var(--accent-cyan)">FLOW</small>
      </button>
      <button class="action-btn" onclick="triggerPose('cart')">
        <span>🍜 MERGE CART</span>
        <small style="color:var(--accent-amber)">TREATS</small>
      </button>
    </div>

    <!-- Modular Cart Customizer Swapper -->
    <div class="customizer-row">
      <span>TREATS CART MODULE:</span>
      <select id="cartThemeSelect" onchange="swapCartTheme(this.value)">
        <option value="bangkokShavedIce">Bangkok Shaved Ice (Mint/Sun)</option>
        <option value="sonoranSatay">Desert Skewer Griddle (Rust/Gold)</option>
        <option value="nightMarketBoba">Midnight Market (Neon/Cyan)</option>
      </select>
    </div>

    <div class="hud-metrics">
      <span>WAYMO QUEUE: <strong id="val-av">2</strong></span>
      <span>CART BUFFER: <strong id="val-cart">12m</strong></span>
      <span>SCORE: <strong id="val-score">0</strong></span>
    </div>
  </div>

  <script>
    /* Modular Cart Layer Builder (Dynamic SVG generation) */
    const CartPresets = {
      bangkokShavedIce: {
        body: "#e9edc9",
        awning: "#d4a373",
        valance: "#e76f51",
        label: "SHAVED ICE",
        specialty: "#48cae4"
      },
      sonoranSatay: {
        body: "#d88c51",
        awning: "#bc4749",
        valance: "#6a040f",
        label: "SONORAN SATAY",
        specialty: "#ffb703"
      },
      nightMarketBoba: {
        body: "#2b2d42",
        awning: "#7209b7",
        valance: "#f72585",
        label: "T-ISLAND BOBA",
        specialty: "#4cc9f0"
      }
    };

    function generateCartSVG(themeKey) {
      const cfg = CartPresets[themeKey] || CartPresets.bangkokShavedIce;
      return `
        <g id="cart-rig" filter="url(#hardShadow)">
          <!-- Ground Occlusion -->
          <ellipse cx="75" cy="140" rx="70" ry="8" fill="#0c090e" opacity="0.6"/>
          <!-- Chassis & Wheels -->
          <line x1="25" y1="125" x2="125" y2="125" stroke="#1f2421" stroke-width="6"/>
          <circle cx="35" cy="125" r="18" fill="#343a40" stroke="#111" stroke-width="3"/>
          <circle cx="35" cy="125" r="6" fill="#adb5bd"/>
          <circle cx="115" cy="125" r="18" fill="#343a40" stroke="#111" stroke-width="3"/>
          <circle cx="115" cy="125" r="6" fill="#adb5bd"/>
          <!-- Main Body Paneling -->
          <rect x="15" y="65" width="120" height="55" rx="4" fill="${cfg.body}" stroke="#111" stroke-width="3"/>
          <rect x="25" y="75" width="100" height="20" rx="3" fill="#1b1c1e" stroke="#111" stroke-width="2"/>
          <text x="75" y="89" fill="${cfg.specialty}" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">${cfg.label}</text>
          <!-- Countertop & Glass Partition -->
          <rect x="10" y="60" width="130" height="7" rx="2" fill="#ced4da" stroke="#111" stroke-width="2"/>
          <path d="M 30 60 L 30 35 L 75 35 L 75 60 Z" fill="rgba(255,255,255,0.25)" stroke="#111" stroke-width="1.5"/>
          <!-- Bangkok Canopy Posts -->
          <line x1="18" y1="60" x2="18" y2="20" stroke="#111" stroke-width="3"/>
          <line x1="132" y1="60" x2="132" y2="20" stroke="#111" stroke-width="3"/>
          <!-- Scalloped Awning / Roof -->
          <polygon points="10,24 140,24 128,6 22,6" fill="${cfg.awning}" stroke="#111" stroke-width="3"/>
          <path d="M 10 24 Q 22 34 35 24 Q 47 34 60 24 Q 72 34 85 24 Q 97 34 110 24 Q 125 34 140 24" fill="${cfg.valance}" stroke="#111" stroke-width="2"/>
        </g>
      `;
    }

    /* Active Entity Manager */
    const slot = document.getElementById("entity-slot");
    function renderEntity(type) {
      if (type === "cart") {
        const sel = document.getElementById("cartThemeSelect").value;
        slot.innerHTML = generateCartSVG(sel);
      } else {
        // Render Cel-Shaded Autonomous Vehicle (Waymo I-PACE / Minivan Form)
        slot.innerHTML = `
          <g id="av-rig" filter="url(#hardShadow)">
            <ellipse cx="90" cy="130" rx="85" ry="10" fill="#0c090e" opacity="0.6"/>
            <!-- Wheels -->
            <circle cx="35" cy="120" r="16" fill="#1b1c1e" stroke="#111" stroke-width="3"/>
            <circle cx="145" cy="120" r="16" fill="#1b1c1e" stroke="#111" stroke-width="3"/>
            <!-- Body Hull -->
            <path d="M 10 112 Q 25 80 60 80 L 125 80 Q 165 85 175 112 Z" fill="#ffffff" stroke="#111" stroke-width="3"/>
            <!-- Roof LIDAR Sensor Dome -->
            <rect x="80" y="62" width="22" height="18" rx="4" fill="#003566" stroke="#111" stroke-width="2"/>
            <circle cx="91" cy="65" r="4" fill="#2ec4b6"/>
            <!-- Front Windshield & Windows -->
            <path d="M 58 84 L 80 84 L 80 102 L 35 102 Z" fill="#0f1416" stroke="#111" stroke-width="1.5"/>
            <path d="M 85 84 L 125 84 L 140 102 L 85 102 Z" fill="#0f1416" stroke="#111" stroke-width="1.5"/>
            <!-- Autonomous Halo Decal -->
            <path d="M 15 108 L 30 92" stroke="#2ec4b6" stroke-width="4" stroke-linecap="round"/>
          </g>
        `;
      }
    }

    function swapCartTheme(themeKey) {
      renderEntity("cart");
    }

    /* Warden Kinematics & Pose Controller */
    let currentScore = 0;
    function triggerPose(action) {
      const armGroup = document.getElementById("warden-arms");
      const indicator = document.getElementById("flow-indicator");
      
      if (action === "halt") {
        // Left arm tucked, right arm straight up
        armGroup.innerHTML = `
          <path d="M 10 44 L 2 60" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round"/>
          <circle cx="2" cy="62" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
          <path d="M 30 44 L 34 20 L 34 10" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round"/>
          <polygon points="30,10 38,10 39,2 31,2" fill="#fff" stroke="#111" stroke-width="1.5"/>
        `;
        indicator.textContent = "STATE: AV HALTED";
        indicator.style.color = "var(--accent-red)";
        renderEntity("av");
      } else if (action === "wave") {
        // Dramatic sweep forward
        armGroup.innerHTML = `
          <path d="M 8 44 L -18 36" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round"/>
          <circle cx="-22" cy="35" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
          <path d="M 32 44 L 54 48 L 70 42" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round"/>
          <circle cx="74" cy="40" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
        `;
        indicator.textContent = "STATE: FLOW EXPEDITED";
        indicator.style.color = "var(--accent-cyan)";
        currentScore += 50;
      } else if (action === "cart") {
        // Both hands guiding lane merge
        armGroup.innerHTML = `
          <path d="M 8 44 L -12 28 L -18 18" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round"/>
          <polygon points="-22,18 -14,18 -16,10 -24,10" fill="#fff" stroke="#111" stroke-width="1.5"/>
          <path d="M 32 44 L 20 62 L 6 64" stroke="#8ea8c3" stroke-width="6" stroke-linecap="round"/>
          <circle cx="2" cy="64" r="4" fill="#fff" stroke="#111" stroke-width="1.5"/>
        `;
        indicator.textContent = "STATE: STREET FOOD CORRIDOR";
        indicator.style.color = "var(--accent-amber)";
        renderEntity("cart");
        currentScore += 100;
      }
      document.getElementById("val-score").textContent = currentScore;
    }

    // Init with AV on the field
    renderEntity("av");
  </script>
</body>
</html>
