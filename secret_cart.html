<svg viewBox="0 0 1600 1000" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#131118; font-family:'Courier New', monospace, sans-serif;">
  <defs>
    <!-- Hard Contrast Cel Drop Shadow -->
    <filter id="celShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="5" dy="6" stdDeviation="0" flood-color="#08070b" flood-opacity="0.95"/>
    </filter>
    <!-- Cyan Telemetry Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Linear Gradients -->
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1822"/>
      <stop offset="100%" stop-color="#100e14"/>
    </linearGradient>
    <pattern id="cadGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#25212e" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#383245"/>
    </pattern>
  </defs>

  <!-- Background CAD Grid -->
  <rect width="1600" height="1000" fill="url(#gridGrad)" />
  <rect width="1600" height="1000" fill="url(#cadGrid)" />

  <!-- Outer Blueprint Border -->
  <rect x="25" y="25" width="1550" height="950" fill="none" stroke="#2ec4b6" stroke-width="2" opacity="0.4"/>
  <rect x="35" y="35" width="1530" height="930" fill="none" stroke="#2ec4b6" stroke-width="1" stroke-dasharray="8,6" opacity="0.2"/>

  <!-- ==================== HEADER HUD BAR ==================== -->
  <g id="hud-header" transform="translate(60, 50)">
    <rect x="0" y="0" width="1480" height="65" fill="#1b1722" stroke="#2ec4b6" stroke-width="2" filter="url(#celShadow)"/>
    <path d="M 0 0 L 15 0 L 0 15 Z M 1480 50 L 1465 65 L 1480 65 Z" fill="#2ec4b6"/>
    <text x="30" y="40" fill="#2ec4b6" font-size="22" font-weight="900" letter-spacing="4">TW-PHX // TECHNICAL SPECIFICATION INFOGRAPHIC</text>
    <text x="750" y="28" fill="#ff9f1c" font-size="12" font-weight="700" letter-spacing="2">SYSTEM: ADOT TRAFFIC WARDEN &amp; TURTLE ISLAND TREATS</text>
    <text x="750" y="48" fill="#8d99ae" font-size="11" letter-spacing="1">PROJECT RUNTIME: OPENXR VR / GET_PWND_CLI STANDALONE VECTOR ENGINE</text>
    <rect x="1360" y="15" width="90" height="35" fill="#ff9f1c" rx="4"/>
    <text x="1405" y="38" fill="#131118" font-size="14" font-weight="900" text-anchor="middle">REV 1.0</text>
  </g>

  <!-- ==================== PANEL 1: ADOT TRAFFIC WARDEN SPEC ==================== -->
  <g id="panel-warden" transform="translate(60, 145)">
    <!-- Container Box -->
    <rect x="0" y="0" width="720" height="780" fill="#18151f" stroke="#3b3547" stroke-width="2" filter="url(#celShadow)"/>
    <rect x="0" y="0" width="720" height="36" fill="#231e2c"/>
    <text x="20" y="24" fill="#ff9f1c" font-size="14" font-weight="900" letter-spacing="2">[SECTION 01] ADOT TRAFFIC WARDEN PEACE OFFICER // MODEL SPEC</text>

    <!-- Floor Pedestal Platform -->
    <polygon points="180,680 440,680 470,730 150,730" fill="#2a2533" stroke="#0e0c12" stroke-width="4"/>
    <rect x="150" y="730" width="320" height="25" fill="#1b1722" stroke="#0e0c12" stroke-width="3"/>
    <text x="310" y="747" fill="#ff9f1c" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="3">ADOT ELEVATED KIOSK PODIUM</text>

    <!-- Character Orthographic Model (Cel-Shaded Front Elevation) -->
    <g id="character-art" filter="url(#celShadow)">
      <!-- Boots -->
      <rect x="250" y="650" width="42" height="32" rx="4" fill="#100e12" stroke="#000" stroke-width="3"/>
      <rect x="328" y="650" width="42" height="32" rx="4" fill="#100e12" stroke="#000" stroke-width="3"/>
      <!-- Trousers (Khaki / Slate) -->
      <path d="M 252 420 L 246 652 L 292 652 L 310 510 L 328 652 L 374 652 L 368 420 Z" fill="#2b3a4a" stroke="#0a0e13" stroke-width="4"/>
      <!-- Deep Cel Shadow Split on Legs -->
      <path d="M 280 420 L 292 652 L 310 510 L 328 652 L 350 420 Z" fill="#1b2530"/>
      <!-- Duty Belt & Holster -->
      <rect x="240" y="405" width="140" height="20" rx="3" fill="#181310" stroke="#000" stroke-width="3"/>
      <rect x="300" y="403" width="20" height="24" fill="#ff9f1c" stroke="#000" stroke-width="2"/>
      <rect x="350" y="415" width="26" height="40" rx="4" fill="#100e12" stroke="#000" stroke-width="2"/>
      <!-- Torso Uniform Shirt -->
      <path d="M 226 230 L 394 230 L 380 410 L 240 410 Z" fill="#8ea8c3" stroke="#0a0e13" stroke-width="4"/>
      <path d="M 310 230 L 310 410" stroke="#0a0e13" stroke-width="2" stroke-dasharray="6,4"/>
      <!-- Cel Shadow Half-Torso -->
      <path d="M 310 230 L 394 230 L 380 410 L 310 410 Z" fill="#718ba6"/>
      <!-- Sam Browne Leather Cross-Belt -->
      <line x1="250" y1="230" x2="350" y2="410" stroke="#1d1611" stroke-width="12" stroke-linecap="square"/>
      <line x1="250" y1="230" x2="350" y2="410" stroke="#ff9f1c" stroke-width="2" stroke-dasharray="6,6"/>
      <!-- Badges -->
      <rect x="252" y="270" width="28" height="12" fill="#ff9f1c" stroke="#000" stroke-width="2"/>
      <polygon points="340,265 352,275 348,290 332,290 328,275" fill="#ffd166" stroke="#000" stroke-width="2"/>
      <!-- Arms: Signalling Posture -->
      <!-- Left Arm: Straight Semaphore Halt (High Palm) -->
      <path d="M 390 240 L 490 170" stroke="#8ea8c3" stroke-width="28" stroke-linecap="round"/>
      <path d="M 390 240 L 490 170" stroke="#718ba6" stroke-width="28" stroke-linecap="round" stroke-dasharray="0,30,40,0"/>
      <circle cx="505" cy="158" r="18" fill="#ffffff" stroke="#000" stroke-width="4"/>
      <!-- Right Arm: Low Semaphore Sweep -->
      <path d="M 230 240 L 130 290" stroke="#8ea8c3" stroke-width="28" stroke-linecap="round"/>
      <circle cx="115" cy="300" r="18" fill="#ffffff" stroke="#000" stroke-width="4"/>
      <!-- Neck & Head -->
      <rect x="294" y="195" width="32" height="40" fill="#c68b59" stroke="#000" stroke-width="3"/>
      <circle cx="310" cy="180" r="32" fill="#d4a373" stroke="#000" stroke-width="4"/>
      <!-- Staccato Dark Mustache & Sunglasses -->
      <rect x="286" y="166" width="20" height="12" rx="2" fill="#111"/>
      <rect x="314" y="166" width="20" height="12" rx="2" fill="#111"/>
      <line x1="304" y1="172" x2="316" y2="172" stroke="#111" stroke-width="3"/>
      <path d="M 292 196 Q 310 205 328 196" stroke="#111" stroke-width="5" fill="none"/>
      <!-- Peaked Cap -->
      <path d="M 264 165 L 356 165 L 366 125 L 254 125 Z" fill="#ffffff" stroke="#0a0e13" stroke-width="4"/>
      <path d="M 260 162 L 360 162 L 340 174 L 280 174 Z" fill="#1b263b" stroke="#0a0e13" stroke-width="3"/>
      <circle cx="310" cy="142" r="6" fill="#ff9f1c" stroke="#000" stroke-width="2"/>
    </g>

    <!-- Technical Dimension Lines & Callouts -->
    <g id="warden-callouts" stroke="#2ec4b6" stroke-width="1.5">
      <!-- Callout: Cap -->
      <line x1="366" y1="135" x2="550" y2="110"/>
      <circle cx="550" cy="110" r="3" fill="#2ec4b6"/>
      <text x="560" y="114" fill="#2ec4b6" font-size="11" font-weight="700">HIGH-CROWN PEAKED SUN VISOR</text>

      <!-- Callout: Gloves -->
      <line x1="520" y1="165" x2="570" y2="190"/>
      <circle cx="570" cy="190" r="3" fill="#2ec4b6"/>
      <text x="580" y="194" fill="#ffffff" font-size="11" font-weight="700">WHITE HIGH-VIS SEMAPHORE GLOVE</text>
      <text x="580" y="208" fill="#8d99ae" font-size="10">Luminescent Coated // Retroreflective</text>

      <!-- Callout: Sam Browne -->
      <line x1="320" y1="330" x2="540" y2="330"/>
      <circle cx="540" cy="330" r="3" fill="#2ec4b6"/>
      <text x="550" y="334" fill="#2ec4b6" font-size="11" font-weight="700">45mm HARNESS LEATHER BELT</text>

      <!-- Callout: Trousers -->
      <line x1="250" y1="520" x2="90" y2="520"/>
      <circle cx="90" cy="520" r="3" fill="#2ec4b6"/>
      <text x="80" y="515" fill="#2ec4b6" font-size="11" font-weight="700" text-anchor="end">DESERT SAND RIPSTOP</text>
      <text x="80" y="530" fill="#8d99ae" font-size="10" text-anchor="end">Heat-Tolerant UV Weave</text>

      <!-- Pose Telemetry Matrix -->
      <rect x="30" y="650" width="105" height="70" fill="#110e17" stroke="#3b3547" stroke-width="1.5"/>
      <text x="40" y="670" fill="#ff9f1c" font-size="10" font-weight="700">POSE MATRIX:</text>
      <text x="40" y="688" fill="#2ec4b6" font-size="9">P1: HALT AV [OK]</text>
      <text x="40" y="702" fill="#2ec4b6" font-size="9">P2: WAVE ADV [OK]</text>
      <text x="40" y="716" fill="#8d99ae" font-size="9">P3: MERGE CART</text>
    </g>
  </g>

  <!-- ==================== PANEL 2: TURTLE ISLAND TREATS CART ==================== -->
  <g id="panel-cart" transform="translate(820, 145)">
    <!-- Container Box -->
    <rect x="0" y="0" width="720" height="780" fill="#18151f" stroke="#3b3547" stroke-width="2" filter="url(#celShadow)"/>
    <rect x="0" y="0" width="720" height="36" fill="#231e2c"/>
    <text x="20" y="24" fill="#2ec4b6" font-size="14" font-weight="900" letter-spacing="2">[SECTION 02] TURTLE ISLAND TREATS // MODULAR BANGKOK CART</text>

    <!-- Cart Rendering (Cel-Shaded Exploded Schematic View) -->
    <g id="cart-art" transform="translate(40, 100)" filter="url(#celShadow)">
      <!-- Ground Occlusion Hard Shadow -->
      <ellipse cx="320" cy="540" rx="280" ry="24" fill="#08070b" opacity="0.9"/>

      <!-- Undercarriage Chassis -->
      <rect x="100" y="470" width="440" height="18" rx="4" fill="#23262b" stroke="#000" stroke-width="4"/>
      <!-- Spoked 20-inch Wheels -->
      <g id="wheel-left">
        <circle cx="170" cy="480" r="54" fill="#1b1c1e" stroke="#000" stroke-width="5"/>
        <circle cx="170" cy="480" r="40" fill="none" stroke="#383d44" stroke-width="3"/>
        <line x1="170" y1="426" x2="170" y2="534" stroke="#717983" stroke-width="2"/>
        <line x1="116" y1="480" x2="224" y2="480" stroke="#717983" stroke-width="2"/>
        <circle cx="170" cy="480" r="14" fill="#ff9f1c" stroke="#000" stroke-width="3"/>
      </g>
      <g id="wheel-right">
        <circle cx="470" cy="480" r="54" fill="#1b1c1e" stroke="#000" stroke-width="5"/>
        <circle cx="470" cy="480" r="40" fill="none" stroke="#383d44" stroke-width="3"/>
        <line x1="470" y1="426" x2="470" y2="534" stroke="#717983" stroke-width="2"/>
        <line x1="416" y1="480" x2="524" y2="480" stroke="#717983" stroke-width="2"/>
        <circle cx="470" cy="480" r="14" fill="#ff9f1c" stroke="#000" stroke-width="3"/>
      </g>

      <!-- Lower Utility / Battery Bay -->
      <rect x="110" y="380" width="420" height="90" rx="6" fill="#f4eedb" stroke="#000" stroke-width="4"/>
      <!-- Cel Shadow Band -->
      <path d="M 110 430 L 530 400 L 530 470 L 110 470 Z" fill="#d8c8a8"/>
      <!-- Battery Hatch Door -->
      <rect x="130" y="405" width="130" height="50" rx="4" fill="#3a4048" stroke="#000" stroke-width="2"/>
      <text x="195" y="435" fill="#2ec4b6" font-size="10" font-weight="900" text-anchor="middle">5.2 kWh LiFePO4</text>

      <!-- Main Signage Panel -->
      <rect x="280" y="405" width="230" height="50" rx="6" fill="#2d6a4f" stroke="#000" stroke-width="3"/>
      <text x="395" y="435" fill="#d8f3dc" font-size="13" font-weight="900" text-anchor="middle" letter-spacing="1">TURTLE ISLAND TREATS</text>

      <!-- Stainless Steel Countertop Deck -->
      <polygon points="80,380 560,380 540,350 100,350" fill="#e8edf2" stroke="#000" stroke-width="4"/>
      <!-- Steam Wells / Shaved Ice Basins -->
      <rect x="130" y="340" width="110" height="16" fill="#9aa0a6" stroke="#000" stroke-width="2"/>
      <rect x="270" y="336" width="160" height="20" fill="#bdc1c6" stroke="#000" stroke-width="2"/>

      <!-- Vertical Canopy Uprights -->
      <line x1="120" y1="350" x2="120" y2="120" stroke="#1d1611" stroke-width="8" stroke-linecap="square"/>
      <line x1="520" y1="350" x2="520" y2="120" stroke="#1d1611" stroke-width="8" stroke-linecap="square"/>

      <!-- Bangkok Corrugated Awning / Roof -->
      <polygon points="70,140 570,140 530,70 110,70" fill="#e87a2a" stroke="#000" stroke-width="5"/>
      <!-- Scalloped Valance Drop -->
      <path d="M 70 140 Q 95 165 120 140 Q 145 165 170 140 Q 195 165 220 140 Q 245 165 270 140 Q 295 165 320 140 Q 345 165 370 140 Q 395 165 420 140 Q 445 165 470 140 Q 495 165 520 140 Q 545 165 570 140 Z" fill="#bc4749" stroke="#000" stroke-width="3"/>
      <!-- Top Mount Solar Panel Array -->
      <polygon points="130,70 510,70 480,45 160,45" fill="#1b263b" stroke="#000" stroke-width="3"/>
      <line x1="250" y1="70" x2="265" y2="45" stroke="#2ec4b6" stroke-width="2"/>
      <line x1="385" y1="70" x2="375" y2="45" stroke="#2ec4b6" stroke-width="2"/>
    </g>

    <!-- Cart Technical Dimensions & Callouts -->
    <g id="cart-callouts" stroke="#2ec4b6" stroke-width="1.5">
      <!-- Width Dimension Line -->
      <line x1="110" y1="670" x2="610" y2="670"/>
      <line x1="110" y1="660" x2="110" y2="680"/>
      <line x1="610" y1="660" x2="610" y2="680"/>
      <text x="360" y="662" fill="#2ec4b6" font-size="12" font-weight="700" text-anchor="middle">OVERALL LENGTH: 1950 mm</text>

      <!-- Height Callout -->
      <line x1="630" y1="145" x2="630" y2="640"/>
      <line x1="620" y1="145" x2="640" y2="145"/>
      <line x1="620" y1="640" x2="640" y2="640"/>
      <text x="645" y="400" fill="#2ec4b6" font-size="11" font-weight="700" transform="rotate(90, 645, 400)" text-anchor="middle">APEX HEIGHT: 2020 mm</text>

      <!-- Modular Feature Tags -->
      <rect x="30" y="705" width="660" height="50" fill="#110e17" stroke="#3b3547" stroke-width="1.5"/>
      <text x="50" y="735" fill="#ff9f1c" font-size="11" font-weight="700">MODULAR MODULES:</text>
      <text x="200" y="735" fill="#ffffff" font-size="11">[01] SHAVED ICE</text>
      <text x="350" y="735" fill="#ffffff" font-size="11">[02] DESERT SATAY</text>
      <text x="510" y="735" fill="#ffffff" font-size="11">[03] BOBA TAP</text>
    </g>
  </g>

  <!-- ==================== FOOTER STATUS BAR ==================== -->
  <g id="footer-bar" transform="translate(60, 940)">
    <text x="0" y="0" fill="#8d99ae" font-size="11">PHOENIX URBAN GRID AV INTEGRATION // SPEC SPEC-PHX-ADOT-TIT-01 // PURE SVG VECTOR BLUEPRINT</text>
    <text x="1480" y="0" fill="#2ec4b6" font-size="11" text-anchor="end">CEL-SHADED LAYER COMPLETE [PASS]</text>
  </g>
</svg>
