<svg viewBox="0 0 1400 1900" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#1b251c; font-family:'Rockwell', 'Georgia', serif;">
  <defs>
    <!-- Paper Texture & Print Grain Filter -->
    <filter id="nps-grain" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.95  0 0 0 0 0.91  0 0 0 0 0.82  0 0 0 0.08 0" in="noise" result="coloredNoise"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <!-- Router Carved Wood Depth Filter -->
    <filter id="woodCarve" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="4" stdDeviation="0" flood-color="#141c15" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- ==================== OUTER POSTER BORDER & AGED PAPER ==================== -->
  <!-- Heavy Dark Timber Frame -->
  <rect x="20" y="20" width="1360" height="1860" rx="18" fill="#2d382c" stroke="#121812" stroke-width="12"/>
  <!-- Aged Canvas / Ranger Station Plaque Body -->
  <rect x="45" y="45" width="1310" height="1810" rx="10" fill="#f4ebd9" stroke="#3b4d3a" stroke-width="6"/>
  <!-- Weathered Inner Margin Line -->
  <rect x="65" y="65" width="1270" height="1770" fill="none" stroke="#685641" stroke-width="3" stroke-dasharray="14,10"/>

  <!-- ==================== HEADER: PARK SERVICE ARROWHEAD BANNER ==================== -->
  <g id="header-badge" transform="translate(100, 95)">
    <!-- NPS Arrowhead Insignia Silhouette -->
    <polygon points="600,10 655,75 640,140 600,165 560,140 545,75" fill="#583c28" stroke="#25170e" stroke-width="4"/>
    <polygon points="600,18 647,75 634,134 600,155 566,134 553,75" fill="#325238"/>
    <!-- Tiny Sequoia & Bison Silhouette in badge -->
    <polygon points="578,115 588,60 598,115" fill="#8cb369"/>
    <ellipse cx="616" cy="110" rx="12" ry="7" fill="#d4a373"/>

    <!-- Header Text Block -->
    <text x="600" y="210" fill="#1b251c" font-size="20" font-weight="900" letter-spacing="6" text-anchor="middle">UNITED STATES DEPARTMENT OF THE INTERIOR</text>
    <text x="600" y="240" fill="#685641" font-size="14" font-weight="700" letter-spacing="4" text-anchor="middle">NATIONAL PARK &amp; MULTI-MODAL TRANSIT SERVICE • SOUTHWEST CORRIDOR</text>

    <!-- Main Carved Sign Plate Title -->
    <g filter="url(#woodCarve)">
      <rect x="100" y="265" width="1000" height="95" rx="8" fill="#2d4a33" stroke="#16291b" stroke-width="5"/>
      <text x="600" y="325" fill="#f4ebd9" font-size="44" font-weight="900" letter-spacing="4" text-anchor="middle">TURTLE ISLAND TREATS</text>
      <text x="600" y="348" fill="#d4a373" font-size="13" font-weight="700" letter-spacing="3" text-anchor="middle">ANATOMY OF THE MODULAR BANGKOK-STYLE DESERT PEDESTRIAN CART</text>
    </g>
  </g>

  <!-- ==================== MAIN CART EDUCATIONAL FIELD DIAGRAM ==================== -->
  <g id="cart-field-guide" transform="translate(160, 520)">
    <!-- Soil / Ground Cross-Section -->
    <ellipse cx="540" cy="590" rx="460" ry="35" fill="#d9c5b2" stroke="#8c7a6b" stroke-width="3"/>
    <path d="M 80 590 L 1000 590" stroke="#583c28" stroke-width="4" stroke-dasharray="10,6"/>

    <!-- ================= SUB-ASSEMBLY: WHEELS & AXLE ================= -->
    <!-- Callout Pin [1] -->
    <circle cx="280" cy="510" r="16" fill="#bc4749" stroke="#ffffff" stroke-width="3"/>
    <text x="280" y="516" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">1</text>

    <!-- 20-inch Heavy Duty Pneumatic Spoke Assembly -->
    <g id="wheel-left">
      <circle cx="340" cy="510" r="75" fill="#2b262d" stroke="#161418" stroke-width="7"/>
      <circle cx="340" cy="510" r="54" fill="#4a423f" stroke="#251f1d" stroke-width="3"/>
      <!-- Wire spokes -->
      <line x1="340" y1="435" x2="340" y2="585" stroke="#d9c5b2" stroke-width="2"/>
      <line x1="265" y1="510" x2="415" y2="510" stroke="#d9c5b2" stroke-width="2"/>
      <line x1="287" y1="457" x2="393" y2="563" stroke="#d9c5b2" stroke-width="2"/>
      <line x1="287" y1="563" x2="393" y2="457" stroke="#d9c5b2" stroke-width="2"/>
      <circle cx="340" cy="510" r="18" fill="#bc6c25" stroke="#1b251c" stroke-width="3"/>
    </g>

    <g id="wheel-right">
      <circle cx="740" cy="510" r="75" fill="#2b262d" stroke="#161418" stroke-width="7"/>
      <circle cx="740" cy="510" r="54" fill="#4a423f" stroke="#251f1d" stroke-width="3"/>
      <line x1="740" y1="435" x2="740" y2="585" stroke="#d9c5b2" stroke-width="2"/>
      <line x1="665" y1="510" x2="815" y2="510" stroke="#d9c5b2" stroke-width="2"/>
      <line x1="687" y1="457" x2="793" y2="563" stroke="#d9c5b2" stroke-width="2"/>
      <line x1="687" y1="563" x2="793" y2="457" stroke="#d9c5b2" stroke-width="2"/>
      <circle cx="740" cy="510" r="18" fill="#bc6c25" stroke="#1b251c" stroke-width="3"/>
    </g>

    <!-- Structural Axle -->
    <rect x="260" y="495" width="560" height="24" rx="4" fill="#38302b" stroke="#1a1512" stroke-width="4"/>

    <!-- ================= SUB-ASSEMBLY: POWER CORE & BELLY HULL ================= -->
    <!-- Insulated Body Paneling -->
    <rect x="250" y="320" width="580" height="175" rx="8" fill="#ede0d4" stroke="#28221e" stroke-width="5"/>
    <path d="M 250 400 L 830 360 L 830 495 L 250 495 Z" fill="#ddb892" opacity="0.6"/>

    <!-- Battery Bay Compartment Door [Callout 2] -->
    <rect x="280" y="380" width="180" height="90" rx="4" fill="#4a423f" stroke="#211c19" stroke-width="3"/>
    <!-- Louvered vents -->
    <line x1="300" y1="400" x2="440" y2="400" stroke="#ede0d4" stroke-width="3"/>
    <line x1="300" y1="415" x2="440" y2="415" stroke="#ede0d4" stroke-width="3"/>
    <line x1="300" y1="430" x2="440" y2="430" stroke="#ede0d4" stroke-width="3"/>
    <circle cx="260" cy="380" r="16" fill="#bc4749" stroke="#ffffff" stroke-width="3"/>
    <text x="260" y="386" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">2</text>

    <!-- Plaque Graphics on Front Panel -->
    <rect x="490" y="380" width="310" height="85" rx="6" fill="#2d4a33" stroke="#1b2e20" stroke-width="4"/>
    <text x="645" y="420" fill="#f4ebd9" font-size="17" font-weight="900" text-anchor="middle" letter-spacing="1">TURTLE ISLAND TREATS</text>
    <text x="645" y="442" fill="#d4a373" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">PHOENIX MUNICIPAL CORRIDOR</text>

    <!-- ================= SUB-ASSEMBLY: MODULAR PREP DECK ================= -->
    <!-- Brushed Stainless Food Surface [Callout 3] -->
    <polygon points="210,320 870,320 840,270 240,270" fill="#ccd5ae" stroke="#283618" stroke-width="4"/>
    <circle cx="210" cy="275" r="16" fill="#bc4749" stroke="#ffffff" stroke-width="3"/>
    <text x="210" y="281" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">3</text>

    <!-- Cutaway Steam Pan & Shaved Ice Housing -->
    <rect x="280" y="245" width="130" height="35" rx="3" fill="#e9edc9" stroke="#283618" stroke-width="3"/>
    <rect x="440" y="235" width="180" height="45" rx="4" fill="#faedcd" stroke="#283618" stroke-width="3"/>
    <text x="530" y="262" fill="#606c38" font-size="11" font-weight="900" text-anchor="middle">SATAY STEAM GRIDDLE</text>

    <!-- ================= SUB-ASSEMBLY: CANOPY & SOLAR ROOF ================= -->
    <!-- Heavy Solid Timber Uprights -->
    <rect x="270" y="50" width="18" height="230" fill="#583c28" stroke="#1d140e" stroke-width="4"/>
    <rect x="790" y="50" width="18" height="230" fill="#583c28" stroke="#1d140e" stroke-width="4"/>

    <!-- Bangkok Scalloped Canvas Awning [Callout 4] -->
    <polygon points="190,80 890,80 840,-10 240,-10" fill="#bc6c25" stroke="#432818" stroke-width="5"/>
    <!-- Scalloped Canvas Valance Trim -->
    <path d="M 190 80 Q 225 120 260 80 Q 295 120 330 80 Q 365 120 400 80 Q 435 120 470 80 Q 505 120 540 80 Q 575 120 610 80 Q 645 120 680 80 Q 715 120 750 80 Q 785 120 820 80 Q 855 120 890 80" fill="#99582a" stroke="#432818" stroke-width="4"/>
    <circle cx="175" cy="40" r="16" fill="#bc4749" stroke="#ffffff" stroke-width="3"/>
    <text x="175" y="46" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">4</text>

    <!-- Integrated Thin-Film Solar Array [Callout 5] -->
    <polygon points="260,-10 820,-10 790,-45 290,-45" fill="#283618" stroke="#141a0c" stroke-width="4"/>
    <line x1="420" y1="-10" x2="430" y2="-45" stroke="#a3b18a" stroke-width="2"/>
    <line x1="580" y1="-10" x2="570" y2="-45" stroke="#a3b18a" stroke-width="2"/>
    <circle cx="830" cy="-35" r="16" fill="#bc4749" stroke="#ffffff" stroke-width="3"/>
    <text x="830" y="-29" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">5</text>
  </g>

  <!-- ==================== FIELD GUIDE LEGEND & PARK NOTES ==================== -->
  <g id="field-notes" transform="translate(100, 1220)">
    <!-- Legend Box Board -->
    <rect x="0" y="0" width="1200" height="540" rx="8" fill="#ece1ce" stroke="#4a3e35" stroke-width="4"/>
    <rect x="0" y="0" width="1200" height="42" rx="4" fill="#3b4d3a"/>
    <text x="30" y="28" fill="#f4ebd9" font-size="15" font-weight="900" letter-spacing="3">FIELD GUIDE SPECIFICATIONS • OBSERVE &amp; PRESERVE</text>

    <!-- 2-Column Educational Notes -->
    <!-- Column 1 -->
    <g transform="translate(40, 75)">
      <!-- Item 1 -->
      <circle cx="16" cy="16" r="16" fill="#bc4749"/>
      <text x="16" y="22" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">1</text>
      <text x="45" y="16" fill="#1b251c" font-size="16" font-weight="900">ALL-TERRAIN SPOKED WHEEL ASSEMBLY (20-INCH)</text>
      <text x="45" y="36" fill="#4a3e35" font-size="13" width="480">
        Engineered for rapid transitions between high-capacity pedestrian paths and multi-modal asphalt lanes. High-clearance rims preserve undercarriage integrity across urban curb cuts.
      </text>

      <!-- Item 2 -->
      <circle cx="16" cy="116" r="16" fill="#bc4749"/>
      <text x="16" y="122" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">2</text>
      <text x="45" y="116" fill="#1b251c" font-size="16" font-weight="900">5.2 kWh LiFePO4 POWER CORE</text>
      <text x="45" y="136" fill="#4a3e35" font-size="13">
        Houses high-stability thermal-resistant cells providing uninterrupted off-grid power for refrigeration and induction elements through extreme Sonoran heat waves.
      </text>

      <!-- Item 3 -->
      <circle cx="16" cy="216" r="16" fill="#bc4749"/>
      <text x="16" y="222" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">3</text>
      <text x="45" y="216" fill="#1b251c" font-size="16" font-weight="900">SWAPPABLE CULINARY PAYLOAD DECK</text>
      <text x="45" y="236" fill="#4a3e35" font-size="13">
        Food-grade 304 brushed stainless assembly allowing immediate morning-to-night conversion between Shaved Ice boba basins and dry-rub satay steam griddles.
      </text>
    </g>

    <!-- Column 2 -->
    <g transform="translate(620, 75)">
      <!-- Item 4 -->
      <circle cx="16" cy="16" r="16" fill="#bc4749"/>
      <text x="16" y="22" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">4</text>
      <text x="45" y="16" fill="#1b251c" font-size="16" font-weight="900">BANGKOK SCALLOPED CANVAS AWNING</text>
      <text x="45" y="36" fill="#4a3e35" font-size="13">
        Iconic low-angle solar shield modeled after traditional Southeast Asian night-market stalls. Casts a continuous 8-foot cooling perimeter over patrons and queuing pedestrians.
      </text>

      <!-- Item 5 -->
      <circle cx="16" cy="116" r="16" fill="#bc4749"/>
      <text x="16" y="122" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">5</text>
      <text x="45" y="116" fill="#1b251c" font-size="16" font-weight="900">FLEXIBLE THIN-FILM SOLAR ARRAY</text>
      <text x="45" y="136" fill="#4a3e35" font-size="13">
        Lightweight monocrystalline top canopy constantly replenishing the lower battery reserves during direct midday desert peak sun exposure.
      </text>

      <!-- Ranger Station Rules Sub-Card -->
      <g transform="translate(45, 195)">
        <rect x="0" y="0" width="480" height="110" rx="4" fill="#dfd3be" stroke="#8c7a6b" stroke-width="2"/>
        <text x="15" y="26" fill="#583c28" font-size="12" font-weight="900" letter-spacing="1">INTERSECTION COEXISTENCE DIRECTIVE:</text>
        <text x="15" y="48" fill="#2d382c" font-size="11">1. Yield without exception to ADOT Warden semaphore signals.</text>
        <text x="15" y="68" fill="#2d382c" font-size="11">2. Maintain 3.5m spatial buffer from autonomous vehicle sensor cones.</text>
        <text x="15" y="88" fill="#2d382c" font-size="11">3. Pack out all compostable wooden skewers and shaved ice cups.</text>
      </g>
    </g>

    <!-- Ranger Badge / Smoky Signoff at Base -->
    <path d="M 40 460 L 1160 460" stroke="#685641" stroke-width="1"/>
    <text x="600" y="495" fill="#3b4d3a" font-size="13" font-weight="900" letter-spacing="3" text-anchor="middle">PREPARED BY THE PHOENIX MULTI-MODAL TRAFFIC EDUCATION DIVISION</text>
    <text x="600" y="515" fill="#8c7a6b" font-size="11" text-anchor="middle">POST NO UNAUTHORIZED PLACARDS • MAINTAIN THE URBAN HABITAT</text>
  </g>
</svg>
