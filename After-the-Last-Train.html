<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glox eZine // Punch Cards - After the Last Train</title>
<style>
  :root {
    --bg-deep: #111318;
    --panel-bg: #1a1e24;
    --line-color: #2e3540;
    --accent-copper: #c87d55;
    --accent-moss: #4a6b5d;
    --accent-glitch: #e06c75;
    --text-main: #d0d5dd;
    --text-muted: #8892b0;
    --cell-shadow: rgba(0, 0, 0, 0.4);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-deep);
    color: var(--text-main);
    font-family: 'Courier New', Courier, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .ezine-container {
    width: 100%;
    max-width: 900px;
    background: var(--panel-bg);
    border: 2px solid var(--line-color);
    box-shadow: 8px 8px 0px var(--cell-shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header Zine Bar */
  .zine-header {
    background: var(--bg-deep);
    padding: 0.75rem 1.25rem;
    border-bottom: 2px solid var(--line-color);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
  }

  .zine-title {
    color: var(--accent-copper);
    font-weight: bold;
  }

  .zine-meta {
    color: var(--text-muted);
  }

  /* Main Cover Artwork Area */
  .cover-art-wrapper {
    position: relative;
    width: 100%;
    background: #0d0f12;
    border-bottom: 2px solid var(--line-color);
    display: flex;
    justify-content: center;
    align-items: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
  }

  /* Footer / P2P Download Section */
  .download-section {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .track-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px dashed var(--line-color);
    padding-bottom: 0.75rem;
  }

  .track-title {
    font-size: 1.1rem;
    color: var(--text-main);
    font-weight: bold;
  }

  .track-subtitle {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.25srem;
  }

  .p2p-panel {
    background: var(--bg-deep);
    border: 1px solid var(--line-color);
    padding: 1rem;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 1rem;
    align-items: center;
  }

  .hash-display {
    font-size: 0.75rem;
    color: var(--accent-copper);
    word-break: break-all;
  }

  .download-btn {
    background: var(--accent-moss);
    color: #ffffff;
    border: none;
    padding: 0.75rem 1.5rem;
    font-family: inherit;
    font-weight: bold;
    font-size: 0.85rem;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    transition: background 0.2s ease;
  }

  .download-btn:hover {
    background: #587d6d;
  }

  @media (max-width: 600px) {
    .p2p-panel {
      grid-template-columns: 1fr;
    }
    .download-btn {
      width: 100%;
    }
    .track-info {
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }
  }
</style>
</head>
<body>
