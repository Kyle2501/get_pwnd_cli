<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLOX eZine // P2P Download - Punch Cards</title>
<style>
  :root {
    --bg-color: #0b0f12;
    --panel-bg: #141b22;
    --neon-green: #39ff14;
    --acid-yellow: #ccff00;
    --hot-pink: #ff007f;
    --cyber-cyan: #00f0ff;
    --dark-metal: #1c2430;
    --line-color: #05070a;
    --text-glow: 0 0 10px rgba(57, 255, 20, 0.4);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--acid-yellow);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow-x: hidden;
  }

  .zine-container {
    width: 100%;
    max-width: 800px;
    background: var(--panel-bg);
    border: 3px solid var(--neon-green);
    box-shadow: 0 0 25px rgba(57, 255, 20, 0.2), inset 0 0 15px rgba(0, 0, 0, 0.8);
    position: relative;
    overflow: hidden;
  }

  /* Header banner */
  .zine-header {
    background: var(--line-color);
    border-bottom: 2px dashed var(--neon-green);
    padding: 0.75rem 1rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .zine-title {
    font-size: 1.25rem;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--neon-green);
    text-shadow: var(--text-glow);
  }

  .zine-meta {
    font-size: 0.75rem;
    color: var(--cyber-cyan);
    background: rgba(0, 240, 255, 0.1);
    padding: 0.25rem 0.5rem;
    border: 1px solid var(--cyber-cyan);
  }

  /* Main art viewport */
  .art-viewport {
    width: 100%;
    height: 420px;
    background: linear-gradient(135deg, #0d131a 0%, #1a0b14 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grid overlay for aesthetic */
  .art-viewport::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: linear-gradient(rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Interactive Footer Panel */
  .zine-footer {
    padding: 1.25rem;
    background: var(--dark-metal);
    border-top: 2px solid var(--neon-green);
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .download-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .file-info {
    font-size: 0.85rem;
    color: #fff;
  }

  .file-info span {
    color: var(--hot-pink);
    font-weight: bold;
  }

  .p2p-btn {
    background: var(--neon-green);
    color: var(--line-color);
    font-weight: 900;
    padding: 0.75rem 1.5rem;
    border: none;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 0 10px var(--neon-green);
    transition: all 0.2s ease-in-out;
    text-decoration: none;
    display: inline-block;
  }

  .p2p-btn:hover {
    background: var(--acid-yellow);
    box-shadow: 0 0 20px var(--acid-yellow);
    transform: translateY(-2px);
  }

  .terminal-statusbar {
    font-size: 0.7rem;
    color: #7c90a0;
    border-top: 1px dashed rgba(255, 255, 255, 0.1);
    padding-top: 0.5rem;
    display: flex;
    justify-content: space-between;
  }

  /* CSS Cell Shading & Animation Enhancements */
  .anime-hair {
    fill: #2df8c3;
  }
  .anime-skin {
    fill: #ffe5d0;
  }
  .anime-outfit {
    fill: #f0f4f8;
  }
  .anime-shade {
    fill: rgba(0, 0, 0, 0.18);
  }
  .punch-card {
    fill: #222d3d;
    stroke: var(--cyber-cyan);
    stroke-width: 2;
  }
  .punch-hole {
    fill: var(--bg-color);
  }
</style>
</head>
<body>

<div class="zine-container">

  </div>

  <!-- Interactive Footer -->
  <div class="zine-footer">
    <div class="download-section">
